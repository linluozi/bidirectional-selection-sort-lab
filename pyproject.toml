[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bidsel"
version = "1.0.0"
description = "Three selection-sort arms, and a measured correction to the 'double-ended halves comparisons' claim"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "linluozi" }]
keywords = ["selection-sort", "sorting", "algorithm", "benchmark", "cpython", "bidirectional"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/linluozi/bidirectional-selection-sort-lab"
Changelog = "https://github.com/linluozi/bidirectional-selection-sort-lab/blob/main/docs/CLAIMS.md"

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["bidsel"]
