name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # BIDSEL_FAST=1 shrinks the exhaustive sweep from 1093 to 364 cases.
      # Everything else still runs.
      - name: Run tests (fast profile)
        env:
          BIDSEL_FAST: "1"
        run: python -m unittest discover -s tests -t . -v

      # Windows defaults to cp1252 and these scripts print non-ASCII.
      # --check recomputes every cell and compares against the committed
      # ops.json. Counts are deterministic across machines, so a mismatch is
      # a real behavioural change, not noise.
      - name: Verify operation counts against the committed table
        run: python benchmarks/ops.py --check

      # Timings are machine-specific; run it, but do not dirty the tree.
      - name: Mechanism microbenchmark (no write)
        run: python benchmarks/mechanism.py --no-write

      - name: Smoke-run the timing benchmark
        run: python benchmarks/run_all.py --ci

      # The --ci profile must write results-ci.json and leave results.json
      # alone: results.json is the committed measurement table, and a smoke
      # run must never clobber it.
      - name: Verify the smoke run did not touch results.json
        shell: bash
        run: |
          if git diff --quiet -- benchmarks/results.json; then
            echo "OK: benchmarks/results.json untouched"
          else
            echo "::error::--ci modified benchmarks/results.json"
            git diff --stat -- benchmarks/results.json
            exit 1
          fi

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install matplotlib
        run: pip install "matplotlib>=3.7"

      # Figures are committed, so this checks the generator still runs and the
      # data files it reads are intact — not that the pixels are byte-identical.
      - name: Regenerate figures
        run: python assets/make_figures.py

      - name: Confirm all four figures exist
        shell: bash
        run: |
          for f in speedup-by-shape comparisons-vs-reads mechanism precheck-cost; do
            test -s "assets/$f.png" || { echo "::error::missing assets/$f.png"; exit 1; }
            echo "OK: assets/$f.png"
          done
